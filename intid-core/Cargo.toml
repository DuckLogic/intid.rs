[package]
name = "intid-core"
description = "Defines the IntegerId trait without a dependency on intid_derive"
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories = ["no-std::no-alloc", "no-std", "rust-patterns", "data-structures"]
keywords = ["intid", "id", "counter", "idmap", "integer"]

[dependencies]
num-traits = { version = "0.2", optional = true }
nonmax = { version = "0.5", optional = true }
bytemuck = { version = "1", optional = true }
primint.workspace = true

[features]
default = ["std"]
# Implement traits for the standard library
std = []
# Have UnsignedPrimitiveInteger extend num_traits::PrimInt
# Deprecated: Enable the `num-traits` feature on primint instead.
num-traits = ["dep:num-traits", "primint/num-traits-02"]
# Implement IntegerId for the nonmax integer types
nonmax = ["dep:nonmax"]
# integration with bytemuck
bytemuck = ["dep:bytemuck", "primint/bytemuck"]
# Take advantage of nightly features,
# and implement traits for nightly types
nightly = []
# Implement IntegerId for primint::num::NonZero
primint-nonzero = ["primint/nonzero"]
# Implement IntegerId for primint::num::NonMax
primint-nonmax = ["primint/nonmax"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
